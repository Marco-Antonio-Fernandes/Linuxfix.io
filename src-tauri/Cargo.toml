[package]
name = "fixio-linux"
version = "0.1.0"
description = "Cliente Linux do sistema de gerenciamento Fix.io"
authors = ["Fix.io"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1"
rfd = "0.15"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
