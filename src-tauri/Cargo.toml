[package]
name = "fixio-linux"
version = "0.1.0"
description = "Cliente Linux do sistema de gerenciamento Fix.io"
authors = ["Fix.io"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1"
rfd = "0.15"
gtk = { version = "0.18", features = ["v3_24"] }
gdkx11 = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
futures-channel = "0.3"
fs2 = "0.4"
x11rb = "0.13"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
